<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Arquitectónico Interactivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #050505; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100dvh; display: block; touch-action: none; }
    .top-bar { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 12px; z-index: 20; }
    .brand-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: #ffffff; border: 1px solid #ffffff; padding: 8px 14px; background: #000000; }
    .map-labels-layer { position: absolute; inset: 0; pointer-events: none; z-index: 18; }
    .map-area-label { position: absolute; transform: translate(-50%, -50%); margin-top: 0; padding: 6px 10px; background: rgba(0, 0, 0, 0.88); border: 1px solid rgba(255, 255, 255, 0.65); color: #ffffff; font-size: var(--label-font-size, 10px); line-height: 1; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; cursor: pointer; pointer-events: auto; transition: background 0.2s, color 0.2s; }
    .map-area-label:hover { background: #ffffff; color: #000000; }
    .map-area-label.text-only { background: transparent; border-color: transparent; padding: 3px; text-shadow: 0 1px 5px rgba(0,0,0,.9); }
    .hover-preview-card { position: absolute; width: min(var(--hover-card-width, 320px), 90vw); background: #050505; border: 1px solid rgba(255,255,255,.45); border-radius: 18px; overflow: hidden; z-index: 35; pointer-events: none; opacity: 0; transform: translateY(8px) scale(.97); transition: opacity .18s ease, transform .18s ease; box-shadow: 0 18px 45px rgba(0,0,0,.55); }
    .hover-preview-card.visible { opacity: 1; transform: translateY(0) scale(1); }
    .hover-preview-card img { width: 100%; height: calc(var(--hover-card-height, 250px) - 62px); min-height: 80px; object-fit: cover; display: block; background: #111; }
    .hover-preview-title { padding: 16px 20px 18px; color: #fff; font-size: var(--hover-text-size, 22px); line-height: 1.1; font-weight: 750; }
    .nav-bar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; max-width: 90vw; overflow-x: auto; z-index: 20; }
    .nav-btn { background: transparent; border: 1px solid transparent; color: #888888; padding: 8px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; }
    .nav-btn:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.3); }
    .nav-btn.active { background: #ffffff; color: #000000; font-weight: 700; }
    .immersive-showcase { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(5, 5, 5, 0.65) 100%); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .immersive-showcase.active { opacity: 1; pointer-events: auto; }
    .showcase-card { position: relative; width: 82vw; max-width: 1050px; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.4); padding: 16px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85); transform: scale(0.94) translateY(15px); transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
    .immersive-showcase.active .showcase-card { transform: scale(1) translateY(0); }
    .showcase-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .showcase-title { font-size: calc(var(--popup-text-size, 13px) + 3px); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
    .showcase-desc { font-size: var(--popup-text-size, 13px); color: #a3a3a3; margin-top: 2px; }
    .close-showcase-btn { background: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s; }
    .close-showcase-btn:hover { background: #ffffff; color: #000000; }
    .showcase-media { width: 100%; height: 55vh; min-height: 0; background: #050505; border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .showcase-media img { width: 100%; height: 100%; object-fit: contain; }
    .showcase-gallery-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
    .showcase-copy { max-height: 16vh; overflow-y: auto; padding: 10px 4px 0; color: #d0d0d0; font-size: var(--popup-text-size, 13px); line-height: 1.55; }
    .showcase-copy p + p { margin-top: 10px; }
    #tooltip { position: absolute; padding: 6px 10px; background: #000000; border: 1px solid #ffffff; color: #ffffff; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity 0.15s ease; z-index: 30; transform: translate(12px, 12px); }

    .immersive-showcase { background: rgba(0,0,0,.08); }
    .showcase-card { width: fit-content; max-width: calc(100vw - 40px); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 10px; border-radius: 16px; background: rgba(24,30,34,.28); backdrop-filter: blur(8px) saturate(125%); -webkit-backdrop-filter: blur(8px) saturate(125%); border: 1px solid rgba(255,255,255,.48); box-shadow: 0 12px 36px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); }
    .showcase-card .showcase-header { gap: 12px; margin-bottom: 8px; }
    .showcase-card .showcase-header > div { min-width: 0; overflow-wrap: anywhere; }
    .showcase-card .showcase-desc, .showcase-card .showcase-copy { color: #fff; text-shadow: 0 1px 3px #000; }
    .showcase-card .close-showcase-btn { background: rgba(20,25,30,.25); border-color: rgba(255,255,255,.5); border-radius: 8px; flex-shrink: 0; }
    .showcase-card .showcase-media { width: 100%; height: auto; background: transparent; border: 0; border-radius: 8px; }
    .showcase-card .showcase-media img { width: 100%; height: auto; max-height: calc(100dvh - 170px); object-fit: contain; display: block; }
    .showcase-card .showcase-copy { max-height: 12vh; }
    @media (max-width: 700px) {
      .top-bar { top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; pointer-events: none; }
      .brand-title { font-size: 10px; letter-spacing: 1.2px; padding: 8px 10px; }
      .nav-bar { display: flex !important; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; right: 10px; transform: none; max-width: none; gap: 4px; padding: 5px; scrollbar-width: thin; overscroll-behavior-x: contain; }
      .nav-btn { min-height: 44px; padding: 10px 13px; font-size: 11px; flex: 0 0 auto; }
      .map-area-label { font-size: max(10px, var(--label-font-size, 10px)); padding: 7px 8px; min-height: 30px; max-width: 105px; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
      .hover-preview-card, #tooltip { display: none !important; }
      .immersive-showcase { height: 100dvh; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.5); }
      .showcase-card { width: 100% !important; max-width: 100%; max-height: 100%; padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .showcase-header { align-items: flex-start; }
      .showcase-title { font-size: 14px; letter-spacing: 1px; }
      .showcase-desc { font-size: 12px; }
      .close-showcase-btn { min-height: 44px; padding: 8px 10px; letter-spacing: .4px; }
      .showcase-card .showcase-media img { max-height: min(60dvh, calc(100dvh - 190px)); object-fit: contain; }
      .showcase-card .showcase-copy { max-height: 22dvh; overflow-y: auto; padding-bottom: 6px; }
      .showcase-gallery-controls { gap: 4px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

  <div class="hover-preview-card" id="hoverPreviewCard"><img id="hoverPreviewImg" src="" alt=""><div class="hover-preview-title" id="hoverPreviewTitle"></div></div>
  <div class="nav-bar" id="navBar"><button class="nav-btn active" onclick="goToArea('general')">General</button></div>

  </div>
  <script type="application/json" id="tourConfig">{"version":6,"viewMode":"topdown","floorMapUrl":"https://drive.google.com/file/d/1BBY8TGgFBdaSC2ceGo1m8B6yOH2C-tzP/view?usp=drive_link","floorWidth":26,"floorHeight":46.22222222222222,"showProjectTitle":true,"projectTitle":"Casa Pedro Project","labelsMode":"map","showHoverPreview":false,"hoverCardWidth":320,"hoverCardHeight":250,"labelFontSize":10,"hoverTextSize":22,"popupTextSize":13,"labelStyle":"boxed","labelColor":"#ffffff","backgroundColor":"#050505","architecturalAreas":[{"id":"sum","name":"Habitación","desc":"Área social con mesa de juntas y vista hacia el lago.","x":7.38,"z":-17.31,"w":5.86,"d":5.66,"h":2.2,"viewAngle":120,"renderUrl":"https://drive.google.com/file/d/1WCDDwo9imQ8TQXoD1KhvNa5JT2Lepy9D/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1WCDDwo9imQ8TQXoD1KhvNa5JT2Lepy9D/view?usp=drive_link","angle":120,"caption":"-"}],"textBlocks":[]},{"id":"cocina","name":"Cocina","desc":"Isla de preparación comunicada con el salón.","x":-1.12,"z":-9.82,"w":4.5,"d":4,"h":2,"viewAngle":0,"renderUrl":"https://drive.google.com/file/d/1kH85rqAsloTD4p965nG-jQ-2cQmXVj8p/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1kH85rqAsloTD4p965nG-jQ-2cQmXVj8p/view?usp=drive_link","angle":0,"caption":"-"}],"textBlocks":[]},{"id":"piscina","name":"Comedor","desc":"Espejo de agua principal con solárium y sector circular.","x":-0.88,"z":-5.93,"w":4.69,"d":2.55,"h":0.5,"viewAngle":210,"renderUrl":"https://drive.google.com/file/d/1bIqttpKZnWDbhViC-HlBE7tY0iKX5lLJ/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1bIqttpKZnWDbhViC-HlBE7tY0iKX5lLJ/view?usp=drive_link","angle":210,"caption":"-"}],"textBlocks":[]},{"id":"gimnasio","name":"Patio","desc":"Área deportiva completa orientada al patio posterior.","x":0.23,"z":-17.1,"w":4.68,"d":5,"h":3.54,"viewAngle":90,"renderUrl":"https://drive.google.com/file/d/1hWUNLtLNGS4Lo7LwshQ_89YQhFpuov1e/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1hWUNLtLNGS4Lo7LwshQ_89YQhFpuov1e/view?usp=drive_link","angle":90,"caption":"-"}],"textBlocks":[]},{"id":"area_1790466722667","name":"Patio","desc":"Descripción del espacio arquitectónico.","x":-8.54,"z":-17.61,"w":4,"d":4,"h":2,"viewAngle":220,"renderUrl":"https://drive.google.com/file/d/1-zoiFAtAQCPKr-S-7QIxxhY-IJ1ANaos/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1-zoiFAtAQCPKr-S-7QIxxhY-IJ1ANaos/view?usp=drive_link","angle":220,"caption":"-"}],"textBlocks":[]},{"id":"area_1790466943202","name":"Living","desc":"Descripción del espacio arquitectónico.","x":-0.54,"z":7,"w":4,"d":4,"h":2,"viewAngle":0,"renderUrl":"https://drive.google.com/file/d/1t3VDPWub1hREmM0ONb3JVWtpMef4CXbS/view?usp=drive_link","media":[{"url":"https://drive.google.com/file/d/1t3VDPWub1hREmM0ONb3JVWtpMef4CXbS/view?usp=drive_link","angle":0,"caption":"-"}],"textBlocks":[]}]}</script>
  <script>
    const tourConfig = JSON.parse(document.getElementById('tourConfig').textContent);
    const fixedViewMode = tourConfig.viewMode;
    const floorMapUrl = tourConfig.floorMapUrl;
    const labelsMode = tourConfig.labelsMode || 'bottom';
    const showHoverPreview = tourConfig.showHoverPreview === true;
    const hoverCardWidth = Math.max(180, Number(tourConfig.hoverCardWidth) || 320);
    const hoverCardHeight = Math.max(160, Number(tourConfig.hoverCardHeight) || 250);
    const labelFontSize = Math.max(8, Number(tourConfig.labelFontSize) || 10);
    const hoverTextSize = Math.max(12, Number(tourConfig.hoverTextSize) || 22);
    const popupTextSize = Math.max(10, Number(tourConfig.popupTextSize) || 13);
    const labelStyle = tourConfig.labelStyle === 'boxed' ? 'boxed' : 'text';
    const labelColor = tourConfig.labelColor || '#ffffff';
    const backgroundColor = tourConfig.backgroundColor || '#050505';
    let floorWidth = tourConfig.floorWidth;
    let floorHeight = tourConfig.floorHeight;
    const architecturalAreas = tourConfig.architecturalAreas;
    let activeShowcaseArea = null;
    let activeShowcaseImageIndex = 0;
    document.documentElement.style.setProperty('--hover-card-width', hoverCardWidth + 'px');
    document.documentElement.style.setProperty('--hover-card-height', hoverCardHeight + 'px');
    document.documentElement.style.setProperty('--label-font-size', labelFontSize + 'px');
    document.documentElement.style.setProperty('--hover-text-size', hoverTextSize + 'px');
    document.documentElement.style.setProperty('--popup-text-size', popupTextSize + 'px');

    function normalizeAreaContent(area) {
      if (!Array.isArray(area.media) || !area.media.length) area.media = [{ url: area.renderUrl || '', angle: Number(area.viewAngle) || 0, caption: area.name || '' }];
      if (!Array.isArray(area.textBlocks)) area.textBlocks = area.desc ? [area.desc] : [];
      area.renderUrl = area.media[0]?.url || '';
      area.viewAngle = Number(area.media[0]?.angle) || 0;
      return area;
    }
    architecturalAreas.forEach(normalizeAreaContent);

    function formatDriveUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return 'https://lh3.googleusercontent.com/d/' + match[1];
      }
      return url;
    }

    function getFitFrustumSize() {
      const aspect = window.innerWidth / window.innerHeight;
      if (window.innerWidth <= 700) {
        const availableWidth = Math.max(1, window.innerWidth - 24);
        const availableHeight = Math.max(1, window.innerHeight - 150);
        return Math.max(floorHeight * window.innerHeight / availableHeight,
                        floorWidth * window.innerHeight / availableWidth) * 1.04;
      }
      const padding = 1.15;
      const fitH = floorHeight * padding;
      const fitW = (floorWidth * padding) / aspect;
      return Math.max(fitH, fitW);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(backgroundColor);

    const aspect = window.innerWidth / window.innerHeight;
    let frustumSize = getFitFrustumSize();
    const camera = new THREE.OrthographicCamera((frustumSize * aspect) / -2, (frustumSize * aspect) / 2, frustumSize / 2, frustumSize / -2, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 35, 15);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');
    let floorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    let floorGeo = new THREE.PlaneGeometry(floorWidth, floorHeight);
    const floorPlane = new THREE.Mesh(floorGeo, floorMat);
    floorPlane.rotation.x = -Math.PI / 2;
    floorPlane.receiveShadow = false;
    scene.add(floorPlane);

    function updateFloorTexture(url) {
      if (!url) return;
      textureLoader.load(formatDriveUrl(url), (tex) => {
        tex.anisotropy = 16;
        floorMat.map = tex;
        floorMat.needsUpdate = true;
        if (tex.image && tex.image.width && tex.image.height) {
          const imgAspect = tex.image.width / tex.image.height;
          floorWidth = 26;
          floorHeight = floorWidth / imgAspect;
          floorPlane.geometry.dispose();
          floorPlane.geometry = new THREE.PlaneGeometry(floorWidth, floorHeight);
          updateCameraFrustum();
          goToArea('general');
        }
      });
    }

    const volumeGroup = new THREE.Group();
    scene.add(volumeGroup);
    let interactiveMeshes = [];

    function build3DVolumes() {
      const navBar = document.getElementById('navBar');
      navBar.innerHTML = '<button class="nav-btn active" onclick="goToArea(\'general\')">General</button>';
      const mapLabelsLayer = document.getElementById('mapLabelsLayer');
      mapLabelsLayer.innerHTML = '';
      architecturalAreas.forEach(area => {
        const geo = new THREE.BoxGeometry(area.w, area.h, area.d);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.03, depthWrite: false });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(area.x, area.h / 2, area.z);
        mesh.rotation.set(0, 0, 0);
        mesh.userData = area;

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 }));
        mesh.add(line);
        mesh.lineRef = line;

        volumeGroup.add(mesh);
        interactiveMeshes.push(mesh);

        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerText = area.name.split('&')[0];
        btn.dataset.areaId = area.id;
        btn.onclick = () => goToArea(area.id);
        navBar.appendChild(btn);

        const label = document.createElement('button');
        label.className = 'map-area-label';
        label.innerText = area.name.split('&')[0].trim();
        label.dataset.areaId = area.id;
        label.onclick = (event) => { event.stopPropagation(); goToArea(area.id); };
        mapLabelsLayer.appendChild(label);
      });
      navBar.style.display = labelsMode === 'bottom' || window.innerWidth <= 700 ? 'flex' : 'none';
      mapLabelsLayer.style.display = labelsMode === 'map' ? 'block' : 'none';
      mapLabelsLayer.querySelectorAll('.map-area-label').forEach(label => {
        label.classList.toggle('text-only', labelStyle === 'text');
        label.style.color = labelColor;
      });
    }

    function updateMapLabelPositions() {
      if (labelsMode !== 'map') return;
      architecturalAreas.forEach(area => {
        const label = document.querySelector('.map-area-label[data-area-id="' + area.id + '"]');
        if (!label) return;
        const point = new THREE.Vector3(area.x, area.h / 2, area.z).project(camera);
        label.style.display = point.z >= -1 && point.z <= 1 ? 'block' : 'none';
        label.style.left = ((point.x + 1) / 2 * window.innerWidth) + 'px';
        label.style.top = ((1 - point.y) / 2 * window.innerHeight) + 'px';
      });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let lastTouchSelection = 0;
    const tooltip = document.getElementById('tooltip');
    const hoverPreviewCard = document.getElementById('hoverPreviewCard');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
      positionHoverPreview(e.clientX, e.clientY);

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);
      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hoveredMesh !== hit) {
          resetHover();
          hoveredMesh = hit;
          gsap.to(hoveredMesh.material, { opacity: 0.35, duration: 0.2 });
          gsap.to(hoveredMesh.lineRef.material, { opacity: 0.8, duration: 0.2 });
          document.body.style.cursor = 'pointer';
        }
        tooltip.innerText = hit.userData.name;
        tooltip.style.opacity = showHoverPreview ? '0' : '1';
        if (showHoverPreview) showAreaHoverPreview(hit.userData);
      } else {
        resetHover();
      }
    });

    function positionHoverPreview(clientX, clientY) {
      const gap = 22;
      const cardWidth = Math.min(hoverCardWidth, window.innerWidth * 0.9);
      const cardHeight = hoverCardHeight;
      let left = clientX + gap;
      let top = clientY - cardHeight / 2;
      if (left + cardWidth > window.innerWidth - 12) left = clientX - cardWidth - gap;
      top = Math.max(12, Math.min(top, window.innerHeight - cardHeight - 12));
      hoverPreviewCard.style.left = left + 'px';
      hoverPreviewCard.style.top = top + 'px';
    }

    function showAreaHoverPreview(area) {
      document.getElementById('hoverPreviewTitle').innerText = area.name;
      normalizeAreaContent(area);
      document.getElementById('hoverPreviewImg').src = formatDriveUrl(area.media[0]?.url || '');
      hoverPreviewCard.classList.add('visible');
    }

    function resetHover() {
      if (hoveredMesh) {
        gsap.to(hoveredMesh.material, { opacity: 0.03, duration: 0.2 });
        gsap.to(hoveredMesh.lineRef.material, { opacity: 0.15, duration: 0.2 });
      }
      hoveredMesh = null;
      document.body.style.cursor = 'default';
      tooltip.style.opacity = '0';
      hoverPreviewCard.classList.remove('visible');
    }

    let pointerStart = null;
    renderer.domElement.addEventListener('pointerdown', e => {
      pointerStart = { x: e.clientX, y: e.clientY };
    });
    renderer.domElement.addEventListener('pointerup', e => {
      if (!pointerStart || Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y) > 8) return;
      if (e.pointerType !== 'touch' || document.getElementById('immersiveShowcase').classList.contains('active')) return;
      mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(mouse, camera);
      const hit = raycaster.intersectObjects(interactiveMeshes)[0];
      if (hit) {
        lastTouchSelection = Date.now();
        goToArea(hit.object.userData.id);
      }
      pointerStart = null;
    });
    window.addEventListener('click', (event) => {
      if (event.pointerType === 'touch' || Date.now() - lastTouchSelection < 500) return;
      if (document.getElementById('immersiveShowcase').classList.contains('active') ||
          event.target.closest('.nav-bar, .map-area-label, .immersive-showcase')) return;
      if (hoveredMesh) goToArea(hoveredMesh.userData.id);
    });

    function goToArea(areaId) {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', areaId === (b.dataset.areaId || 'general'));
      });

      if (areaId === 'general') {
        closeShowcase(false);
        updateCameraFrustum();
        return;
      }

      const area = architecturalAreas.find(a => a.id === areaId);
      if (!area) return;
      updateCameraFrustum();
      openShowcase(area);
    }

    function openShowcase(area) {
      normalizeAreaContent(area);
      activeShowcaseArea = area;
      activeShowcaseImageIndex = 0;
      document.getElementById('showcaseTitle').innerText = area.name;
      renderShowcaseContent();
      document.getElementById('immersiveShowcase').classList.add('active');
    }


    function fitShowcaseToImage() {
      const img = document.getElementById('showcaseImg');
      if (!img.naturalWidth || !img.naturalHeight) return;
      const card = img.closest('.showcase-card');
      const ratio = img.naturalWidth / img.naturalHeight;
      if (window.innerWidth <= 700) { card.style.width = ''; return; }
      let width = Math.min(window.innerWidth - 40, window.innerHeight * .76 * ratio + 22);
      for (let i = 0; i < 3; i++) {
        card.style.width = Math.max(1, width) + 'px';
        const extra = card.querySelector('.showcase-header').offsetHeight + document.getElementById('showcaseGalleryControls').offsetHeight + document.getElementById('showcaseCopy').offsetHeight + 56;
        width = Math.min(window.innerWidth - 40, Math.max(60, window.innerHeight - 32 - extra) * ratio + 22);
      }
      card.style.width = Math.max(1, width) + 'px';
    }
    document.getElementById('showcaseImg').addEventListener('load', fitShowcaseToImage);
    window.addEventListener('resize', fitShowcaseToImage);
    function renderShowcaseContent() {
      if (!activeShowcaseArea) return;
      const media = activeShowcaseArea.media[activeShowcaseImageIndex] || activeShowcaseArea.media[0];
      document.getElementById('showcaseImg').src = formatDriveUrl(media?.url || '');
      document.getElementById('showcaseDesc').innerText = media?.caption || 'Render arquitectónico';
      document.getElementById('showcaseImageCount').innerText = (activeShowcaseImageIndex + 1) + ' / ' + activeShowcaseArea.media.length;
      document.getElementById('showcaseGalleryControls').style.display = activeShowcaseArea.media.length > 1 ? 'flex' : 'none';
      const copy = document.getElementById('showcaseCopy');
      copy.innerHTML = '';
      activeShowcaseArea.textBlocks.filter(Boolean).forEach(block => {
        const paragraph = document.createElement('p');
        paragraph.textContent = block;
        copy.appendChild(paragraph);
      });
      copy.style.display = copy.children.length ? 'block' : 'none';
    }

    function changeShowcaseImage(direction) {
      if (!activeShowcaseArea?.media?.length) return;
      activeShowcaseImageIndex = (activeShowcaseImageIndex + direction + activeShowcaseArea.media.length) % activeShowcaseArea.media.length;
      renderShowcaseContent();
    }

    function closeShowcase(returnToGeneral = true) {
      document.getElementById('immersiveShowcase').classList.remove('active');
      activeShowcaseArea = null;
      if (returnToGeneral) goToArea('general');
    }

    function handleShowcaseBackdropClick(e) {
      if (e.target.id === 'immersiveShowcase') {
        e.stopPropagation();
        closeShowcase(true);
      }
    }

    function updateCameraFrustum() {
      const aspect = window.innerWidth / window.innerHeight;
      frustumSize = getFitFrustumSize();
      camera.left = (frustumSize * aspect) / -2;
      camera.right = (frustumSize * aspect) / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
      camera.zoom = 1;
      controls.target.set(0, 0, 0);
      if (fixedViewMode === 'topdown') {
        camera.up.set(0, 0, -1);
        camera.position.set(0, 35, 0.0001);
      } else {
        camera.up.set(0, 1, 0);
        camera.position.set(22, 22, 22);
      }
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', () => {
      updateCameraFrustum();
      document.getElementById('navBar').style.display = labelsMode === 'bottom' || window.innerWidth <= 700 ? 'flex' : 'none';
    });
    window.addEventListener('pageshow', () => {
      goToArea('general');
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateCameraFrustum();
    });
    window.visualViewport?.addEventListener('resize', updateCameraFrustum);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateMapLabelPositions();
      renderer.render(scene, camera);
    }

    updateFloorTexture(floorMapUrl);
    build3DVolumes();
    goToArea('general');
    animate();
  </script>
</body>
</html>
